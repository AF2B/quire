name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build, test and smoke-test the executable
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install SBCL
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl curl
          sbcl --version

      - name: Install Quicklisp
        run: |
          curl -fsSL https://beta.quicklisp.org/quicklisp.lisp -o /tmp/quicklisp.lisp
          sbcl --noinform --non-interactive \
            --load /tmp/quicklisp.lisp \
            --eval '(quicklisp-quickstart:install)' \
            --eval '(ql-util:without-prompting (ql:add-to-init-file))'

      - name: Install dependencies
        run: make deps

      - name: Strict build and test suite
        run: make test

      - name: Build the executable
        run: make binary

      - name: Build the demo site twice and compare
        run: |
          bin/quire version
          bin/quire build --site examples/demo/site.lisp --out /tmp/site-a
          bin/quire build --site examples/demo/site.lisp --out /tmp/site-b
          diff -r /tmp/site-a /tmp/site-b

      - name: Check the links of the demo and product sites
        run: |
          bin/quire check --site examples/demo/site.lisp
          bin/quire check --site site/site.lisp

      - name: Build the product site
        run: bin/quire build --site site/site.lisp --out /tmp/product-site

  portability-ecl:
    name: Test suite on ECL 21.2 (experimental)
    runs-on: ubuntu-latest
    continue-on-error: true
    # Debian 12 ships ECL 21.2; serapeum, which Spinneret depends on, does not
    # compile on the ECL 24.5 that Ubuntu ships.
    container: debian:12-slim
    steps:
      - name: Install ECL and tools
        run: |
          apt-get update
          apt-get install -y ecl curl ca-certificates netbase git

      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install Quicklisp
        run: |
          curl -fsSL https://beta.quicklisp.org/quicklisp.lisp -o /tmp/quicklisp.lisp
          ecl --load /tmp/quicklisp.lisp \
            --eval '(quicklisp-quickstart:install)' \
            --eval '(ql-util:without-prompting (ql:add-to-init-file))' \
            --eval '(ext:quit 0)'

      - name: Run the test suite
        run: |
          ecl --load "$HOME/quicklisp/setup.lisp" \
            --eval '(push (truename ".") asdf:*central-registry*)' \
            --eval '(handler-case (progn (ql:quickload "quire/tests") (asdf:test-system "quire")) (error (e) (format t "~%FAILED: ~A~%" e) (ext:quit 1)))' \
            --eval '(ext:quit 0)'

  portability-ccl:
    name: Test suite on Clozure CL 1.13 (experimental)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install Clozure CL
        run: |
          curl -fsSL https://github.com/Clozure/ccl/releases/download/v1.13/ccl-1.13-linuxx86.tar.gz \
            | sudo tar xz -C /opt
          echo "CCL_DEFAULT_DIRECTORY=/opt/ccl" >> "$GITHUB_ENV"

      - name: Install Quicklisp
        run: |
          curl -fsSL https://beta.quicklisp.org/quicklisp.lisp -o /tmp/quicklisp.lisp
          /opt/ccl/lx86cl64 --load /tmp/quicklisp.lisp \
            --eval '(quicklisp-quickstart:install)' \
            --eval '(ql-util:without-prompting (ql:add-to-init-file))' \
            --eval '(quit 0)'

      - name: Run the test suite
        run: |
          /opt/ccl/lx86cl64 --load "$HOME/quicklisp/setup.lisp" \
            --eval '(push (truename ".") asdf:*central-registry*)' \
            --eval '(handler-case (progn (ql:quickload "quire/tests") (asdf:test-system "quire")) (error (e) (format t "~%FAILED: ~A~%" e) (quit 1)))' \
            --eval '(quit 0)'
